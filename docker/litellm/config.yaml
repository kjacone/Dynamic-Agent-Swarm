# LiteLLM proxy configuration (run via docker/docker-compose.yml --profile litellm).
#
# In the dashboard (Models), add a ModelConfig with:
#   provider    = openai
#   model_name  = <a model_name below>
#   api_key_env = LITELLM_MASTER_KEY
#   base_url    = http://litellm:4000/v1       <- for agent-server / admin-api
#                 http://localhost:4000/v1     <- only for tools on your host
#
# Ollama runs on your host, so it is reached via host.docker.internal.

model_list:
  # ── Anthropic ─────────────────────────────────────────────────
  - model_name: anthropic/claude-sonnet-4-5-20250929
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── OpenAI ────────────────────────────────────────────────────
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Google ────────────────────────────────────────────────────
  - model_name: google_genai/gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GOOGLE_API_KEY

  # ── Ollama (host, outside Docker) ─────────────────────────────
  # Pull the model on your host first:  ollama pull llama3.1:8b
  - model_name: ollama/qwen2.5-coder:7b
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

  # ── vLLM (optional, --profile vllm) ──────────────────────────
  # - model_name: vllm/qwen2.5-1.5b
  #   litellm_params:
  #     model: openai/Qwen/Qwen2.5-1.5B-Instruct
  #     api_base: http://vllm:8000/v1
  #     api_key: not-needed

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

general_settings:
  # Callers use this as their API key. Set LITELLM_MASTER_KEY in .env
  # (must start with "sk-"). Without it, LiteLLM runs with no auth.
  master_key: os.environ/LITELLM_MASTER_KEY