{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nmb.secretName" . }}
  labels:
    {{- include "nmb.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_TOKEN: {{ required "secrets.adminToken is required (or set secrets.existingSecret)" .Values.secrets.adminToken | quote }}
  {{- with .Values.secrets.jwtSecret }}
  NMB_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  NMB_DATABASE_URL: {{ . | quote }}
  {{- end }}
  NMB_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default "" | quote }}
  {{- with .Values.secrets.encryptionOldKeys }}
  NMB_ENCRYPTION_KEYS_OLD: {{ . | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "" | quote }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleApiKey }}
  GOOGLE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.tavilyApiKey }}
  TAVILY_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.langfusePublicKey }}
  LANGFUSE_PUBLIC_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.langfuseSecretKey }}
  LANGFUSE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.qdrantApiKey }}
  QDRANT_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
