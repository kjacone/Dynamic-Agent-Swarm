apiVersion: v1
kind: Service
metadata:
  name: {{ include "nmb.componentName" (dict "root" . "component" "admin-api") }}
  labels:
    {{- include "nmb.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.adminApi.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nmb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
