# Optional extras. Ollama is NOT here: you run it on the host.
#
# Paths below are relative to this file's folder (docker/), and the env file
# is the repo-root .env, so run from the repo root:
#
#   docker compose --env-file .env -f docker/docker-compose.yml --profile litellm up -d
#   docker compose --env-file .env -f docker/docker-compose.yml --profile vllm up -d      # GPU
#   docker compose --env-file .env -f docker/docker-compose.yml --profile training up -d  # GPU

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nmb-litellm
    profiles: ["litellm"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: nmb-vllm
    profiles: ["vllm"]
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  trainer:
    image: hiyouga/llamafactory:latest
    container_name: nmb-trainer
    profiles: ["training"]
    volumes:
      - ../data:/data
      - ./trainer:/runner:ro
      - hf-cache:/root/.cache/huggingface
    environment:
      TRAINING_ROOT: /data/training
      PYTHONUNBUFFERED: "1"
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command: ["python", "/runner/runner.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:

networks:
  default:
    name: agentic-net
    external: true