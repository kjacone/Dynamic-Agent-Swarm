[project]
name = "nmb-marketplace-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
  "deepagents",
  "langgraph-cli[inmem]",
  "langgraph-sdk",
  "tavily-python",
  "langchain-anthropic",
  "langchain-openai",
  "langchain-google-genai",
  "langchain-community",
  "langchain-text-splitters",
  "langchain-ollama>=0.3.0",
  "faiss-cpu",
  "pydantic-settings",
  "sqlmodel>=0.0.22",
  "aiosqlite",
  "fastapi>=0.115",
  "uvicorn[standard]",
  "python-multipart",
  "python-dotenv",
  "httpx",
  "sqlalchemy[asyncio]>=2.0.30",
  "langfuse>=3.0.0",
  "pyjwt[crypto]>=2.8.0",
  "cryptography",
  "pyyaml>=6.0.1",
  "aegra",
]

[project.optional-dependencies]
postgres = ["asyncpg", "langchain-postgres"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmb_marketplace_agent"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
