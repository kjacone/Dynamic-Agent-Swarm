apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nmb.configMapName" . }}
  labels:
    {{- include "nmb.labels" . | nindent 4 }}
data:
  MAIN_MODEL: {{ .Values.config.mainModel | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  LANGGRAPH_URL: {{ include "nmb.langgraphUrl" . | quote }}
  ASYNC_RESEARCHER_URL: {{ include "nmb.langgraphUrl" . | quote }}
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}
  {{- with .Values.config.ollamaUrl }}
  OLLAMA_URL: {{ . | quote }}
  OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.litellmUrl }}
  LITELLM_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.vllmUrl }}
  VLLM_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.langfuseHost }}
  LANGFUSE_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.langfusePublicUrl }}
  LANGFUSE_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ . | quote }}
  {{- end }}
