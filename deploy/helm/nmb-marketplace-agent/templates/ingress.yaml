apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nmb.fullname" . }}
  labels:
    {{- include "nmb.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $service := .service }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                {{- if eq $service "aegra" }}
                name: {{ include "nmb.componentName" (dict "root" $ "component" "aegra") }}
                {{- else if eq $service "dashboard" }}
                name: {{ include "nmb.componentName" (dict "root" $ "component" "dashboard") }}
                {{- else }}
                name: {{ include "nmb.componentName" (dict "root" $ "component" "admin-api") }}
                {{- end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
