services:
  agent-server:
    build:
      context: .
      dockerfile: Dockerfile.aegra
    ports:
      - "2026:2026"
    environment:
      # Aegra state (threads, runs, checkpoints) in aegra-postgres.
      # Component vars on purpose: DATABASE_URL stays unset so the app's own
      # settings.database_url (sqlite in /app/data/app.db) is not hijacked.
      POSTGRES_USER: ${AEGRA_POSTGRES_USER:-aegra}
      POSTGRES_PASSWORD: ${AEGRA_POSTGRES_PASSWORD:-aegra}
      POSTGRES_HOST: aegra-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${AEGRA_POSTGRES_DB:-aegra}
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://aegra-redis:6379/0
      WORKER_COUNT: ${WORKER_COUNT:-3}
      N_JOBS_PER_WORKER: ${N_JOBS_PER_WORKER:-10}
      AUTH_TYPE: ${AUTH_TYPE:-noop}

      MAIN_MODEL: ${MAIN_MODEL:-ollama:llama3.1:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama:nomic-embed-text}
      ASYNC_RESEARCHER_URL: http://agent-server:2026

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LANGGRAPH_URL: http://agent-server:2026
      QDRANT_URL: http://qdrant:6333

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      OTEL_TARGETS: ${OTEL_TARGETS:-LANGFUSE}
      LANGFUSE_HOST: ${LANGFUSE_INTERNAL_URL:-http://langfuse-web:3000}
      LANGFUSE_BASE_URL: ${LANGFUSE_INTERNAL_URL:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      aegra-postgres:
        condition: service_healthy
      aegra-redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      admin-api:
        condition: service_healthy   # admin-api creates the SQLite tables
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2026/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  aegra-postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${AEGRA_POSTGRES_DB:-aegra}
      POSTGRES_USER: ${AEGRA_POSTGRES_USER:-aegra}
      POSTGRES_PASSWORD: ${AEGRA_POSTGRES_PASSWORD:-aegra}
    ports:
      - "127.0.0.1:5434:5432"   # 5432 is Langfuse's postgres
    volumes:
      - aegra_postgres_data:/var/lib/postgresql   # pg18 layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGRA_POSTGRES_USER:-aegra} -d ${AEGRA_POSTGRES_DB:-aegra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  aegra-redis:
    image: redis:7-alpine
    volumes:
      - aegra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    ports:
      - "8000:8000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      MAIN_MODEL: ${MAIN_MODEL:-ollama:llama3.1:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama:nomic-embed-text}

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LANGGRAPH_URL: http://agent-server:2026
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      VLLM_URL: ${VLLM_URL:-}
      QDRANT_URL: http://qdrant:6333

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # LANGFUSE_HOST = what containers call; LANGFUSE_PUBLIC_URL = what the
      # browser opens (used for "open in Langfuse" links).
      LANGFUSE_HOST: ${LANGFUSE_INTERNAL_URL:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data   # also holds data/connections.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE: ${DASHBOARD_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - admin-api
    restart: unless-stopped

  # ── agent-kit demo (static): http://localhost:3001 ─────────────────
  # docker compose --profile demo up -d agent-kit-demo
  agent-kit-demo:
    profiles: ["demo"]
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./agent-kit/example/static:/usr/share/nginx/html:ro
    depends_on:
      - admin-api
    restart: unless-stopped

  # ── agent-kit Next.js example: http://localhost:3002 ───────────────
  # docker compose --profile demo-next up -d --build agent-kit-next
  # NOTE: env var names are guesses until I see example/my-app's route.ts.
  agent-kit-next:
    profiles: ["demo-next"]
    build:
      context: ./agent-kit
      dockerfile: example/my-app/Dockerfile
    ports:
      - "3002:3000"
    environment:
      # Server-side (route handler reads this at runtime)
      LANGGRAPH_API_URL: http://admin-api:8000/v1/lg
      # NEXT_PUBLIC_* work at runtime in `next dev` (not in prod builds) — fine here.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${DEMO_API_KEY:-${ADMIN_TOKEN}}
      NEXT_PUBLIC_AGENT_ID: ${DEMO_AGENT_ID:-}
    depends_on:
      - admin-api
    restart: unless-stopped

volumes:
  qdrant_data:
  aegra_postgres_data:
  aegra_redis_data:

networks:
  default:
    name: agentic-net
    external: true