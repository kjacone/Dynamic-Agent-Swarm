apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nmb.fullname" . }}-migrate
  labels:
    {{- include "nmb.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "nmb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nmb.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: migrate
          image: {{ include "nmb.image" (dict "root" . "image" .Values.images.adminApi) }}
          imagePullPolicy: {{ .Values.images.adminApi.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "nmb.configMapName" . }}
          env:
            # Requires a Postgres registry: migrations do not reach a SQLite file
            # that lives on another pod's volume.
            - name: NMB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "nmb.secretName" . }}
                  key: NMB_DATABASE_URL
                  optional: true
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nmb.secretName" . }}
                  key: ADMIN_TOKEN
          {{- with .Values.adminApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
